<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Recipe Blogs</title>

    <style>
         {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: white;
        }

        .container {
            width: 90%;
            margin: 60px;
            flex-directin: column;
        }

    

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
        }

        .title {
            font-size: 15px;
            font-weight: bold;
            
        }
        

        .top button {
            background: blue;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 7px 15px;
            font-size: 10px;
        }

    

        .main {
            display: flex;
            gap: 60px;
        }


        .left{
            width: 60%;
        }

        .left img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            border-radius: 10px;
        }

        .date {
            font-size: 15px;
            color: solid Black;
            margin-top: 8px;
        }
        
     .tag {
    background-color: lightgreen;
    color: white;
    padding: 5px 10px;
    border-radius: 15px;
    font-size: 10px;
        }

        .left h3 {
            font-size: 10px;
            margin: 5px 0;
        }

        .text {
            font-size: 10px;
            color: solidblack;
            line-height: 1.5;
        }
          .right {
            width: 40%;

            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .recipe {
            display: flex;
            gap: 5px;
        }

        .recipe img {
            width: 100px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
        }

        .recipe-text {
            flex: 1;
        }

        .recipe-text .date {
            margin: 0 0 3px 0;
        }

        .recipe-text span {
            font-size: 8px;
            color: gray;
        }
        

        .recipe-text h4 {
            font-size: 10px;
            margin: 3px 0;
        }

        .recipe-text p {
            font-size: 10px;
            color: black;
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="container">

        
        <div class="top">

            <h1>recipe blogs</h1>

            <button>View more</button>

        </div>
  <div class="main">
    <div class="left">

<img src="https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=800&q=80"
     alt="Grilled Chicken">
    
                <p class="date">November 16, 2018</p>

                <h3>Our Recipes Blog</h3>

                <p class="text">
                Delicious food in our restaurant 
                </p>

            </div>
            <div class="right">
          <div class="recipe">
         <img src="https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=300&q=80"
         alt="Grilled Chicken">

                    <div class="recipe-text">

                        <p class="date">April 27, 2019</p>

                        <span class="tag">food</span>

                        <h4>Hot chicken meals</h4>

                        <p>delicious food</p>

                    </div>
                    </div>
                <div class="recipe">

                <img src="https://images.unsplash.com/photo-1600891964092-4316c288032e?auto=format&fit=crop&w=600&q=80"
     alt="Chicken Dish">

                    <div class="recipe-text">

                        <p class="date">May 14, 2019</p>

                        <span class="tag">food</span>

                        <h4>Instant Pot Pulled</h4>

                        <p>food ur choice</p>

                    </div>
                    </div>
                <div class="recipe">

                    <img src="https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=600&q=80"
     alt="Grilled Chicken">

                    <div class="recipe-text">

                        <p class="date">May 20, 2019</p>

                        <span class="tag">food</span>

                        <h4>Best Grill </h4>

                        <p>grilled lolipop</p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
